<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сленг-Пазл: Бесконечная игра</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1f2a44;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .level-info { font-size: 18px; color: #14b8a6; font-weight: bold; margin-bottom: 20px; }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-gap: 4px;
            justify-content: center;
            margin: 0 auto 20px auto;
            background: #cbd5e1;
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .tile {
            width: 90px;
            height: 90px;
            background-size: 270px 270px; /* 90px * 3 */
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.95); }
        
        /* Всплывающее окно победы */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 80%;
            animation: pop 0.3s ease;
        }
        .modal h2 { color: #10b981; margin-top: 0; font-size: 28px;}
        .modal button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 18px;
            background: #14b8a6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <h1>Собери картинку! 🧩</h1>
    <div class="level-info">Уровень: <span id="level-display">1</span></div>

    <div class="board" id="board"></div>

    <!-- Всплывающее окно -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2 id="modal-title">Поздравляем! 🎉</h2>
            <p id="modal-text">Вы правильно собрали пазл!</p>
            <button onclick="nextLevel()" id="next-btn">Перейти к следующему уровню ➔</button>
        </div>
    </div>

    <script>
        // СПИСОК ТВОИХ КАРТИНОК (они должны лежать в той же папке на GitHub)
        const images = [
            'puzzle.jpg', 
            'puzzle2.png', 
            'puzzle3.jpg'
        ];

        const winTexts = [
            { title: "Поздравляем! 🎉", text: "Вы успешно собрали Скуфа! Теперь он пойдет играть в танки." },
            { title: "Ого! 🎯", text: "Вы справились! Надеюсь, этот пазл не вызвал у вас кринж." },
            { title: "Супер! 💜", text: "Вы собрали картинку (Фармить ауру)!." }
        ];

        let currentLevel = 0;
        const board = document.getElementById('board');
        const modal = document.getElementById('win-modal');
        let selectedTile = null;
        let tiles = [];

        function initGame() {
            board.innerHTML = '';
            modal.style.display = 'none';
            selectedTile = null;
            tiles = [];

            // Если картинки закончились - начинаем заново (бесконечность)
            if (currentLevel >= images.length) {
                currentLevel = 0;
            }
            
            document.getElementById('level-display').textContent = currentLevel + 1;
            const currentImage = images[currentLevel];

            // Создаем 9 квадратиков
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.style.backgroundImage = `url('${currentImage}')`;
                
                // Правильная позиция для фона
                const row = Math.floor(i / 3);
                const col = i % 3;
                tile.style.backgroundPosition = `-${col * 90}px -${row * 90}px`;
                
                // Сохраняем ID правильной позиции
                tile.dataset.correctId = i;
                tile.dataset.currentId = i; // Изначально совпадает
                
                tile.addEventListener('click', () => handleClick(tile));
                tiles.push(tile);
                board.appendChild(tile);
            }

            // Перемешиваем визуально и в логике
            shuffleTiles();
        }

        function shuffleTiles() {
            // Перемешиваем массив DOM-элементов
            for (let i = tiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                board.appendChild(tiles[j]); 
            }
            
            // Обновляем "текущие" позиции в логике
            const currentDOMOrder = Array.from(board.children);
            currentDOMOrder.forEach((tile, index) => {
                tile.dataset.currentId = index;
            });

            // Если случайно собрали при перемешивании - перемешиваем еще раз
            if (checkWin(true)) { shuffleTiles(); }
        }

        function handleClick(tile) {
            if (!selectedTile) {
                selectedTile = tile;
                tile.style.border = '3px solid #14b8a6';
            } else {
                if (selectedTile === tile) {
                    selectedTile.style.border = 'none';
                    selectedTile = null;
                    return;
                }
                
                // Меняем местами визуально
                swapDOM(selectedTile, tile);
                
                // Меняем местами их currentId
                const tempId = selectedTile.dataset.currentId;
                selectedTile.dataset.currentId = tile.dataset.currentId;
                tile.dataset.currentId = tempId;
                
                selectedTile.style.border = 'none';
                selectedTile = null;
                
                checkWin();
            }
        }

        function swapDOM(t1, t2) {
            const t1Next = t1.nextSibling;
            const t2Next = t2.nextSibling;
            
            if (t1Next === t2) { board.insertBefore(t2, t1); } 
            else if (t2Next === t1) { board.insertBefore(t1, t2); } 
            else {
                board.insertBefore(t1, t2Next);
                board.insertBefore(t2, t1Next);
            }
        }

        function checkWin(isShuffling = false) {
            const currentTiles = Array.from(board.children);
            let isWin = true;
            
            for (let i = 0; i < currentTiles.length; i++) {
                // Проверяем, совпадает ли текущая позиция с правильной
                if (currentTiles[i].dataset.currentId !== currentTiles[i].dataset.correctId) {
                    isWin = false;
                    break;
                }
            }
            
            if (isWin && !isShuffling) {
                document.getElementById('modal-title').textContent = winTexts[currentLevel].title;
                document.getElementById('modal-text').textContent = winTexts[currentLevel].text;
                modal.style.display = 'flex';
                return true;
            }
            return false;
        }

        function nextLevel() {
            currentLevel++;
            initGame();
        }

        // Запуск игры
        initGame();
    </script>
</body>
</html>
