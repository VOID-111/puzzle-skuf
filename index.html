<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пазл: Собери Скуфа</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1f2a44;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 24px; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px); /* Размер квадратика */
            grid-gap: 4px;
            justify-content: center;
            margin: 20px auto;
            background: #cbd5e1;
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .tile {
            width: 90px;
            height: 90px;
            background-image: url('puzzle.jpg'); /* Твоя картинка */
            background-size: 270px 270px; /* 90px * 3 */
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s;
        }
        .tile:active { transform: scale(0.95); }
        .win-message {
            display: none;
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
            margin-top: 20px;
            animation: pop 0.5s ease;
        }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        .btn-reset {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #1f2a44;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Собери Скуфа! 🧩</h1>
    <p>Нажимай на два квадратика, чтобы поменять их местами.</p>

    <div class="board" id="board"></div>
    
    <div class="win-message" id="win-message">Победа! 🎉 Ты собрал Скуфа!</div>
    <button class="btn-reset" onclick="initGame()">Начать заново</button>

    <script>
        const board = document.getElementById('board');
        const winMessage = document.getElementById('win-message');
        let tiles = [];

        function initGame() {
            board.innerHTML = '';
            tiles = [];
            winMessage.style.display = 'none';

            // Создаем 9 квадратиков
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                
                // Вычисляем позицию картинки
                const row = Math.floor(i / 3);
                const col = i % 3;
                tile.style.backgroundPosition = `-${col * 90}px -${row * 90}px`;
                
                // Запоминаем правильную позицию
                tile.dataset.correct = i;
                
                // Обработчик клика
                tile.addEventListener('click', () => handleClick(tile));
                
                tiles.push(tile);
                board.appendChild(tile);
            }

            // Перемешиваем (кроме последнего, чтобы решалось)
            shuffle();
        }

        let selectedTile = null;

        function handleClick(tile) {
            if (!selectedTile) {
                selectedTile = tile;
                tile.style.border = '3px solid #14b8a6';
            } else {
                if (selectedTile === tile) {
                    selectedTile.style.border = 'none';
                    selectedTile = null;
                    return;
                }
                // Меняем местами
                swap(selectedTile, tile);
                selectedTile.style.border = 'none';
                selectedTile = null;
                checkWin();
            }
        }

        function swap(t1, t2) {
            // Меняем местами в DOM
            const t1Next = t1.nextSibling;
            const t2Next = t2.nextSibling;
            
            if (t1Next === t2) {
                board.insertBefore(t2, t1);
            } else if (t2Next === t1) {
                board.insertBefore(t1, t2);
            } else {
                board.insertBefore(t1, t2Next);
                board.insertBefore(t2, t1Next);
            }
        }

        function shuffle() {
            // Просто перемешиваем элементы в DOM
            for (let i = tiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                board.appendChild(tiles[j]); 
            }
            // Чтобы не было случайно собранного пазла
            if (checkWin()) { shuffle(); }
        }

        function checkWin() {
            const currentTiles = Array.from(board.children);
            let isWin = true;
            for (let i = 0; i < currentTiles.length; i++) {
                // Проверяем правильность позиции (по фоновому сдвигу)
                const row = Math.floor(i / 3);
                const col = i % 3;
                const expectedPos = `-${col * 90}px -${row * 90}px`;
                if (currentTiles[i].style.backgroundPosition !== expectedPos) {
                    isWin = false;
                    break;
                }
            }
            if (isWin) {
                winMessage.style.display = 'block';
                return true;
            }
            return false;
        }

        // Запуск игры
        initGame();
    </script>
</body>
</html>
